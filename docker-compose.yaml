services:
  scout:
    build:
      context: .
      dockerfile: packages/scout/Dockerfile
    container_name: finney-scout
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BTCRPC_HOST=${BTCRPC_HOST:-bitcoin-node}
    restart: unless-stopped
    networks:
      - finney-network

